      <circle cx="640.0" cy="452.0" r="65" fill="#F4F1EA"/>
      <!-- arrowhead: rounded chevron -->
      <path d="M 530 350 L 740 386 L 704 596" fill="none" stroke="#F4F1EA" stroke-width="122" stroke-linecap="round" stroke-linejoin="round"/>
    </g></g>
    <text x="621" y="1330" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="150" font-weight="700" fill="#1F5E42" letter-spacing="-2">Onward</text>
  </svg>