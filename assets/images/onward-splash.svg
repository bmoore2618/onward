<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="2688" viewBox="0 0 1242 2688">
    <defs>
      <linearGradient id="skyBig" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#CFEBD3"/>
        <stop offset="0.45" stop-color="#E4F3E2"/>
        <stop offset="0.6" stop-color="#F2F6DA"/>
      </linearGradient>
      <radialGradient id="sun" cx="0.78" cy="0.6" r="0.35">
        <stop offset="0" stop-color="#FFF8C6" stop-opacity="1"/>
        <stop offset="0.5" stop-color="#F3F3B8" stop-opacity="0.5"/>
        <stop offset="1" stop-color="#F3F3B8" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9E8CA"/><stop offset="1" stop-color="#A9D9AE"/></linearGradient>
      <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BD29E"/><stop offset="1" stop-color="#6FBB7B"/></linearGradient>
      <linearGradient id="h3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FAA6A"/><stop offset="1" stop-color="#2F8456"/></linearGradient>
      <linearGradient id="h4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E7D52"/><stop offset="1" stop-color="#1B4F36"/></linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>
      <filter id="haze" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="60"/></filter>
    </defs>
    <rect width="1242" height="2688" fill="url(#skyBig)"/>
    <!-- sunrise glow on the horizon -->
    <rect width="1242" height="2688" fill="url(#sun)"/>
    <ellipse cx="980" cy="1650" rx="420" ry="220" fill="#FFF6B8" opacity="0.55" filter="url(#haze)"/>
    <!-- soft cloud wisps -->
    <ellipse cx="300" cy="420" rx="520" ry="60" fill="#FFFFFF" opacity="0.35" filter="url(#haze)"/>
    <ellipse cx="900" cy="760" rx="600" ry="50" fill="#FFFFFF" opacity="0.28" filter="url(#haze)"/>
    <!-- hills, far to near -->
    <path d="M -100 1700 C 200 1560, 500 1600, 800 1680 S 1200 1720, 1342 1640 L 1342 2788 L -100 2788 Z" fill="url(#h1)"/>
    <path d="M -100 1860 C 260 1700, 620 1760, 900 1860 S 1250 1900, 1342 1830 L 1342 2788 L -100 2788 Z" fill="url(#h2)"/>
    <path d="M -100 2060 C 220 1900, 560 1940, 860 2060 S 1230 2120, 1342 2040 L 1342 2788 L -100 2788 Z" fill="url(#h3)"/>
    <path d="M -100 2060 C 220 1900, 560 1940, 860 2060 S 1230 2120, 1342 2040" fill="none" stroke="#B9F0B0" stroke-width="26" opacity="0.7" filter="url(#glow)"/>
    <path d="M -100 2330 C 300 2200, 640 2240, 920 2360 S 1260 2400, 1342 2340 L 1342 2788 L -100 2788 Z" fill="url(#h4)"/>
    <path d="M -100 2330 C 300 2200, 640 2240, 920 2360 S 1260 2400, 1342 2340" fill="none" stroke="#9BDC95" stroke-width="22" opacity="0.6" filter="url(#glow)"/>
    <!-- the tile -->
    <g transform="translate(441 780) scale(0.3515625)">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="#93D693"/>
        <stop offset="0.55" stop-color="#55B471"/>
        <stop offset="1" stop-color="#3C9C63"/>
      </linearGradient>
      <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3E9C66"/>
        <stop offset="1" stop-color="#2A7E54"/>
      </linearGradient>
      <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#276F4B"/>
        <stop offset="1" stop-color="#174D35"/>
      </linearGradient>
      <linearGradient id="fan" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#BFE3C6"/>
        <stop offset="1" stop-color="#F4F1EA"/>
      </linearGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
      <clipPath id="clip"><rect width="1024" height="1024" rx="230"/></clipPath>
    </defs>
    <rect width="1024" height="1024" rx="230" fill="url(#sky)"/>
    <g clip-path="url(#clip)">
      <!-- back hill with a soft lit ridge -->
      <path d="M -80 540 C 160 400, 430 430, 650 530 S 980 600, 1120 510 L 1120 1120 L -80 1120 Z" fill="url(#hillBack)"/>
      <path d="M -80 540 C 160 400, 430 430, 650 530 S 980 600, 1120 510" fill="none" stroke="#8ED696" stroke-width="22" opacity="0.55" filter="url(#soft)"/>
      <!-- front hill -->
